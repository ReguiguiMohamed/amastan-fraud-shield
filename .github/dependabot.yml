version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Tunis"
    cooldown:
      default-days: 14
    # The merge workflow sets automerge or semver-major. Skip Dependabot's default labels.
    labels: []
    groups:
      pip:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: []
    cooldown:
      default-days: 14
    groups:
      docker:
        update-types: ["minor", "patch"]
    ignore:
      # numpy 1.26 and scipy 1.14 have no wheels for newer Pythons. Move this with pyproject.toml.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: []
    cooldown:
      default-days: 14
    groups:
      github-actions:
        update-types: ["minor", "patch"]
