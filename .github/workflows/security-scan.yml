name: Weekly Security Report

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install "$(grep '^pip-audit==' requirements-dev.txt)"

      # A known vulnerability fails the run, and the Failure issues workflow reports it.
      - name: Audit runtime dependencies
        run: pip-audit --requirement requirements.txt

  code-scanning:
    name: Semgrep and Bandit to code scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Uploads SARIF results to code scanning.
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install "$(grep '^bandit' requirements-dev.txt)"

      - name: Run Bandit
        run: bandit -r src dashboard scripts -ll -f sarif -o bandit.sarif --exit-zero

      - name: Run Semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --config p/python --config p/security-audit --sarif --output semgrep.sarif src dashboard scripts

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: bandit.sarif
          category: bandit

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
