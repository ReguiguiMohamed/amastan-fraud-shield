name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "src/**"
      - "requirements.txt"
      - "README.md"
      - "Dockerfile"
      - ".env.example"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API to Hugging Face Space
    if: github.repository == 'ReguiguiMohamed/hybrid-real-time-fraud-detection-tunisia'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Push API files to Hugging Face Space
        id: push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set. Skipping deploy."
            echo "To enable: add HF_TOKEN to GitHub repo secrets (Settings > Secrets and variables > Actions)"
            exit 0
          fi

          SPACE_NAME="MohamedReg/amastan-fraud-shield-api"
          CLONE_DIR="hf-space"

          echo "Cloning current HF Space state..."
          git clone --depth=1 \
            "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE_NAME}" \
            "$CLONE_DIR"

          cd "$CLONE_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -rf --quiet . 2>/dev/null || true

          echo "Copying API files from source..."
          cp "$GITHUB_WORKSPACE/README.md" .
          cp "$GITHUB_WORKSPACE/Dockerfile" .
          cp "$GITHUB_WORKSPACE/.env.example" .
          cp "$GITHUB_WORKSPACE/requirements.txt" .
          cp -r "$GITHUB_WORKSPACE/dashboard" ./dashboard/
          cp -r "$GITHUB_WORKSPACE/src" ./src/

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          SOURCE_SHA=$(cd "$GITHUB_WORKSPACE" && git rev-parse --short HEAD)
          git commit -m "Deploy amastan-fraud-shield@${SOURCE_SHA}"

          echo "Pushing to Hugging Face Space..."
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push only queues the Space build. Wait for it so a broken image fails here.
      - name: Wait for the Space build
        if: steps.push.outputs.pushed == 'true'
        run: |
          building=0
          for _ in $(seq 1 90); do
            sleep 10
            stage=$(curl -fsS https://huggingface.co/api/spaces/MohamedReg/amastan-fraud-shield-api | jq -r .runtime.stage) || stage=unreachable
            echo "$stage"
            case "$stage" in
              *BUILDING|*APP_STARTING) building=1 ;;
              RUNNING) [ "$building" = 1 ] && exit 0 ;;
              *ERROR) [ "$building" = 1 ] && exit 1 ;;
            esac
          done
          exit 1
